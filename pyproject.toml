[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-shared"
version = "1.0.0"
description = "Settings helpers shared by the portfolio backend and frontend."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["portfolio_shared"]

[tool.ruff]
line-length = 100
# Django generates these; they are not hand-maintained source.
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]

[tool.pylint.main]
load-plugins = ["pylint_django"]
# Two Django projects live here, each with its own settings module, and neither
# is importable from the repo root. Put both service roots on the path and let
# each lint run name the settings it needs (see README, "Linting").
init-hook = "import sys; sys.path[:0] = ['backend', 'frontend']"
ignore-paths = ["^.*/migrations/.*$", "^\\.venv/.*$"]

[tool.pylint.format]
max-line-length = 100

[tool.coverage.report]
# Read ONLY by the `coverage xml` step, which is the one that runs from the
# repository root. Coverage looks for its config in the current directory and
# does not walk up, so the three `coverage run` lines -- which start from
# backend/ and frontend/ -- never see this section; what they must measure is
# given to them as `--source` on the command line instead. A [tool.coverage.run]
# section here would be dead config.
#
# `*/migrations/*` is the same exclusion ruff spells as extend-exclude above,
# flake8 as `exclude` in .flake8, and pylint as ignore-paths: four tools, four
# syntaxes, none able to read another's list. The other four names are Django's
# generated scaffolding, which this project does not hand-maintain.
omit = ["*/migrations/*", "*/manage.py", "*/wsgi.py", "*/asgi.py", "*/settings.py"]
